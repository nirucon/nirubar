[package]
name = "nirubar"
version = "0.18.24"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "Minimal NIRU X11 status bar for NIRUWM"

[dependencies]
x11rb = { version = "0.13", features = ["randr", "res"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Keep the lockfile compatible with the declared Rust 1.75 baseline.
indexmap = "=2.7.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_json = "1"
ab_glyph = "0.2"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
