name: Release

# NIRUBAR releases independently; NIRUX pins its verified component version.
#
# A release is always built from a tag. `workflow_dispatch` exists only to
# rebuild an existing tag and takes that tag as input; it refuses to run
# otherwise, so assets can never be published from a branch.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to rebuild, for example v0.18.36"
        required: true
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse anything that is not a tag
        env:
          REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ -n "$INPUT_TAG" ] || { echo "refusing: a tag is required"; exit 1; }
            case "$INPUT_TAG" in
              v*) : ;;
              *) echo "refusing: tag must start with v"; exit 1 ;;
            esac
            echo "TAG=$INPUT_TAG" >> "$GITHUB_ENV"
          else
            case "$REF" in
              refs/tags/v*) echo "TAG=${REF#refs/tags/}" >> "$GITHUB_ENV" ;;
              *) echo "refusing: release must be built from a v* tag, got $REF"; exit 1 ;;
            esac
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Confirm the tag matches the version being built
        run: |
          version=$(awk -F '"' '/^version = / {print $2; exit}' Cargo.toml)
          [ "v$version" = "$TAG" ] || {
            echo "refusing: Cargo.toml says v$version but the tag is $TAG"; exit 1;
          }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Test the shipping libc ABI
        run: cargo test --locked --target x86_64-unknown-linux-musl --bin nirubar filesystem_query
      - name: Verify the binary is static
        run: |
          bin=target/x86_64-unknown-linux-musl/release/nirubar
          file "$bin"
          if ldd "$bin" 2>&1 | grep -q "=>"; then
            echo "::error::nirubar is dynamically linked"; exit 1
          fi
      - name: Render the bar in a real X server
        run: |
          sudo apt-get install -y xvfb x11-utils x11-apps x11-xserver-utils imagemagick fonts-dejavu-core
          mkdir -p /tmp/h/.config/niruwm/themes
          cp config.example.toml /tmp/h/.config/niruwm/config.toml
          cp themes/niru-noir.toml /tmp/h/.config/niruwm/themes/
          for spec in "800 93" "1366 94" "1920 95"; do
            set -- $spec
            width=$1
            display=$2
            Xvfb :$display -screen 0 ${width}x32x24 -nolisten tcp &
            xvfb=$!
            sleep 2
            export DISPLAY=:$display HOME=/tmp/h
            target/x86_64-unknown-linux-musl/release/nirubar & pid=$!
            sleep 2
            kill -0 $pid || { echo "::error::bar exited at ${width}px"; exit 1; }
            # Wait until the bar has painted something.
            i=0
            while [ $i -lt 40 ]; do
              sleep 0.2
              if xwd -root -silent > /tmp/bar.xwd 2>/dev/null; then
                n=$(convert /tmp/bar.xwd -format "%k" info:)
                [ "$n" -gt 3 ] && break
              fi
              i=$((i + 1))
            done
            colours=$(convert /tmp/bar.xwd -format "%k" info:)
            echo "${width}px distinct colours: $colours"
            [ "$colours" -gt 3 ] || { echo "::error::bar rendered nothing at ${width}px"; exit 1; }
            kill $pid $xvfb 2>/dev/null || true
            wait $pid 2>/dev/null || true
            wait $xvfb 2>/dev/null || true
          done
      - name: Exact rendered theme colours
        run: sh tests/theme-colors.sh target/x86_64-unknown-linux-musl/release/nirubar
      - run: |
          version=$(awk -F '"' '/^version = / {print $2; exit}' Cargo.toml)
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/nirubar dist/
          cd dist && sha256sum nirubar > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          make_latest: true
          files: |
            dist/nirubar
            dist/SHA256SUMS
          generate_release_notes: true
