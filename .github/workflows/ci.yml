name: Rust and X11
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: sh tests/install-smoke.sh
      - run: sudo apt-get update && sudo apt-get install -y xvfb xfonts-base fonts-dejavu-core xdotool x11-apps imagemagick
      - run: xvfb-run -a -s '-screen 0 1280x1024x24 -noreset' cargo test --locked --test x11 -- --ignored --test-threads=1
      - name: Exact rendered theme colours
        run: sh tests/theme-colors.sh "$PWD/target/release/nirubar"
      - name: Bound probes while media is scrolling
        run: sh tests/resource-check.sh "$PWD/target/release/nirubar"

  distros:
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            image: debian:trixie
          - distro: arch
            image: archlinux:base-devel
          - distro: void
            image: voidlinux/voidlinux:latest
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - name: Bootstrap native Rust toolchain
        shell: sh
        run: |
          case "${{ matrix.distro }}" in
            debian) apt-get update && apt-get install -y cargo rustc gcc git ca-certificates ;;
            arch) pacman -Syu --noconfirm --needed rust gcc git ca-certificates ;;
            void)
              for d in /etc/xbps.d /usr/share/xbps.d; do
                for conf in "$d"/*.conf; do
                  [ -f "$conf" ] || continue
                  sed -i 's#alpha.de.repo.voidlinux.org#repo-default.voidlinux.org#g' "$conf"
                done
              done
              xbps-install -Suy xbps
              xbps-install -Suy
              xbps-install -Sy rust cargo gcc git libstdc++ ca-certificates
              ;;
          esac
      - uses: actions/checkout@v4
      - run: cargo test --locked && cargo build --release --locked
      - name: One config file, two programs
        shell: sh
        run: |
          # Build the window manager from source so the test uses this
          # commit's parser, not an older release.
          git clone --depth 1 https://github.com/nirucon/niruwm /tmp/nw
          ( cd /tmp/nw && cargo build --release --locked )
          mkdir -p /tmp/pair
          cp target/release/nirubar /tmp/pair/
          cp /tmp/nw/target/release/niruwm /tmp/pair/
          sh tests/config-agreement.sh /tmp/pair
